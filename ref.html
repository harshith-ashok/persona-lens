<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PersonaLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050708; --panel:rgba(10,14,15,0.82); --panel-strong:rgba(8,11,12,0.94);
  --line:rgba(126,240,214,0.22); --line-strong:rgba(126,240,214,0.5);
  --ink:#EAF6F2; --ink-dim:#8FA39D;
  --glow:#3DFBD1; --glow-dim:rgba(61,251,209,0.55);
  --id:#FFB238; --id-dim:rgba(255,178,56,0.5);
  --rec:#FF4757;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --font-ui:'Space Grotesk','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root, :root[data-theme="light"], :root[data-theme="dark"]{
  --bg:#050708; --panel:rgba(10,14,15,0.82); --panel-strong:rgba(8,11,12,0.94);
  --line:rgba(126,240,214,0.22); --line-strong:rgba(126,240,214,0.5);
  --ink:#EAF6F2; --ink-dim:#8FA39D; --glow:#3DFBD1; --glow-dim:rgba(61,251,209,0.55);
  --id:#FFB238; --id-dim:rgba(255,178,56,0.5); --rec:#FF4757;
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{ font-family:inherit; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
:focus-visible{ outline:2px solid var(--glow); outline-offset:2px; }

/* ================= VIEWFINDER (primary + only default view) ================= */
.viewfinder{
  position:relative; width:100%; height:100svh; min-height:560px; overflow:hidden; background:#000;
}
.viewfinder video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1);
  filter:contrast(1.05) saturate(0.92);
}
.viewfinder video.hidden{ display:none; }
canvas.wave{ position:absolute; inset:0; width:100%; height:100%; display:none; }
canvas.wave.on{ display:block; }

.idle-plate{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;
  background:radial-gradient(circle at 50% 42%, #0C1112 0%, #030405 78%);
}
.idle-ring{
  width:min(30vw,180px); height:min(30vw,180px); border-radius:50%; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; position:relative;
}
.idle-ring::before{
  content:""; position:absolute; inset:-16px; border-radius:50%; border:1px solid rgba(126,240,214,0.1);
  animation:idle-spin 14s linear infinite;
}
@keyframes idle-spin{ to{ transform:rotate(360deg); } }
.idle-ring svg{ width:34%; height:34%; stroke:var(--glow-dim); }
@media (prefers-reduced-motion: reduce){ .idle-ring::before{ animation:none; } }

/* scrim so HUD chrome stays legible over any footage */
.scrim-top{ position:absolute; top:0; left:0; right:0; height:26%; background:linear-gradient(to bottom, rgba(0,0,0,0.55), transparent); pointer-events:none; }
.scrim-bottom{ position:absolute; bottom:0; left:0; right:0; height:34%; background:linear-gradient(to top, rgba(0,0,0,0.62), transparent); pointer-events:none; }

/* corner brackets */
.brackets span{ position:absolute; width:26px; height:26px; border-color:var(--line-strong); pointer-events:none; }
.brackets .tl{ top:calc(16px + env(safe-area-inset-top,0px)); left:16px; border-top:1.5px solid; border-left:1.5px solid; }
.brackets .tr{ top:calc(16px + env(safe-area-inset-top,0px)); right:16px; border-top:1.5px solid; border-right:1.5px solid; }
.brackets .bl{ bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:16px; border-bottom:1.5px solid; border-left:1.5px solid; }
.brackets .br{ bottom:calc(16px + env(safe-area-inset-bottom,0px)); right:16px; border-bottom:1.5px solid; border-right:1.5px solid; }

/* top HUD row: status readout, mode toggle, menu */
.hud-top{
  position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); left:50px; right:50px;
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px; z-index:5;
}
.readout{
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-dim); display:flex; align-items:center; gap:8px; padding-top:3px;
}
.readout .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); flex:none; transition:background .2s ease, box-shadow .2s ease; }
.readout .dot.live{ background:var(--rec); box-shadow:0 0 0 3px rgba(255,71,87,0.22); animation:blink 1.4s ease-in-out infinite; }
.readout .dot.ok{ background:var(--glow); box-shadow:0 0 0 3px rgba(61,251,209,0.2); }
.readout .dot.match{ background:var(--id); box-shadow:0 0 0 3px rgba(255,178,56,0.2); }
@keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
@media (prefers-reduced-motion: reduce){ .readout .dot.live{ animation:none; } }
.readout .val{ color:var(--ink); }

.hud-controls{ display:flex; align-items:center; gap:8px; }
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
  color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:border-color .15s ease, color .15s ease;
}
.icon-btn svg{ width:17px; height:17px; }
.icon-btn:hover{ border-color:var(--line-strong); color:var(--ink); }
.icon-btn.on{ border-color:var(--line-strong); color:var(--glow); }
.icon-btn.id-on{ border-color:var(--id-dim); color:var(--id); }

/* AR face tag */
.face-tag{ position:absolute; z-index:4; pointer-events:none; animation:tagin .3s ease both; }
@keyframes tagin{ from{ opacity:0; transform:scale(.92); } to{ opacity:1; transform:none; } }
.face-tag .box{ position:absolute; inset:0; border:1px solid var(--id); border-radius:2px; }
.face-tag.unknown .box{ border-color:var(--ink-dim); border-style:dashed; }
.face-tag .lead{ position:absolute; top:0; left:100%; width:22px; height:1px; background:var(--id); }
.face-tag.unknown .lead{ background:var(--ink-dim); }
.face-tag .label{
  position:absolute; top:-9px; left:calc(100% + 22px); white-space:nowrap; font-family:var(--font-mono);
  font-size:11px; letter-spacing:.03em; background:var(--panel-strong); border:1px solid var(--id-dim);
  color:var(--id); padding:5px 9px; border-radius:2px;
}
.face-tag.unknown .label{ border-color:var(--line); color:var(--ink-dim); }
.face-tag .label .sub{ display:block; font-size:9.5px; color:var(--ink-dim); margin-top:2px; letter-spacing:.06em; }

/* captions (AR subtitle stack, bottom) */
.captions{
  position:absolute; left:16px; right:16px; bottom:calc(128px + env(safe-area-inset-bottom,0px)); z-index:5;
  display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none;
}
.cap-line{
  max-width:min(560px,88%); display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:3px;
  background:var(--panel); border:1px solid var(--line); font-family:var(--font-mono); font-size:12.5px;
  color:var(--ink); animation:capin .3s ease both; opacity:.55;
}
.cap-line:last-child{ opacity:1; }
@keyframes capin{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
.cap-line .tag{ flex:none; width:7px; height:7px; border-radius:50%; }
.cap-line.host .tag{ background:var(--glow); }
.cap-line.other .tag{ background:var(--id); }

/* bottom dock: mode pill + record */
.dock{
  position:absolute; left:0; right:0; bottom:0; z-index:6; padding:0 0 calc(22px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.mode-pill{
  display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px;
  background:var(--panel); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
}
.mode-pill button{
  border:none; background:none; width:38px; height:32px; border-radius:999px; cursor:pointer;
  color:var(--ink-dim); display:flex; align-items:center; justify-content:center; transition:background .15s ease,color .15s ease;
}
.mode-pill button svg{ width:16px; height:16px; }
.mode-pill button.active{ background:var(--glow); color:#04211B; }
.mode-pill button:disabled{ opacity:.4; cursor:not-allowed; }

.rec-ring{
  width:74px; height:74px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--panel);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
  cursor:pointer; position:relative; transition:transform .12s ease;
}
.rec-ring:hover{ transform:scale(1.03); }
.rec-ring:active{ transform:scale(.96); }
.rec-ring .core{ width:26px; height:26px; border-radius:50%; background:var(--rec); transition:all .2s ease; }
.rec-ring.recording .core{ border-radius:6px; width:22px; height:22px; }
.rec-ring.recording{ animation:recpulse 1.8s ease-out infinite; }
@keyframes recpulse{ 0%{ box-shadow:0 0 0 0 rgba(255,71,87,.4);} 70%{ box-shadow:0 0 0 16px rgba(255,71,87,0);} 100%{ box-shadow:0 0 0 0 rgba(255,71,87,0);} }
@media (prefers-reduced-motion: reduce){ .rec-ring.recording{ animation:none; } }

/* scan sweep during recognition search */
.scan-sweep{
  position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--glow), transparent);
  z-index:3; opacity:0; pointer-events:none;
}
.scan-sweep.active{ animation:sweep 2.1s ease-in-out infinite; opacity:1; }
@keyframes sweep{ 0%{ top:20%; opacity:0; } 8%{ opacity:.85; } 50%{ top:78%; opacity:.85; } 92%{ opacity:0;} 100%{ top:20%; opacity:0; } }
@media (prefers-reduced-motion: reduce){ .scan-sweep{ display:none; } }

/* ================= post-session HUD card ================= */
.session-card-wrap{
  position:absolute; inset:0; z-index:20; display:none; align-items:flex-end; justify-content:center;
  background:rgba(2,3,4,0.5); backdrop-filter:blur(2px); padding:20px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
}
.session-card-wrap.open{ display:flex; animation:fadein .2s ease both; }
@keyframes fadein{ from{ opacity:0;} to{ opacity:1;} }
.session-card{
  width:100%; max-width:440px; background:var(--panel-strong); border:1px solid var(--line-strong);
  border-radius:6px; padding:20px 20px 18px; animation:cardup .3s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes cardup{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:none;} }
.session-card .sc-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.session-card .sc-kicker{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-dim); }
.session-card .sc-close{ background:none; border:none; color:var(--ink-dim); cursor:pointer; padding:4px; }
.session-card .sc-close svg{ width:15px; height:15px; }
.session-card h2{ font-family:var(--font-ui); font-weight:600; font-size:19px; margin:0 0 8px; }
.session-card p{ font-size:13px; line-height:1.55; color:var(--ink-dim); margin:0 0 14px; }
.diar-bar{ height:4px; border-radius:999px; overflow:hidden; display:flex; background:rgba(255,255,255,0.08); margin-bottom:16px; }
.diar-bar span{ height:100%; }
.diar-bar .host{ background:var(--glow); }
.diar-bar .other{ background:var(--id); }
.sc-actions{ display:flex; gap:8px; flex-wrap:wrap; }

.btn{
  border-radius:999px; padding:9px 16px; font-size:13px; font-weight:500; cursor:pointer;
  border:1px solid var(--line-strong); background:transparent; color:var(--ink); transition:all .15s ease;
  display:inline-flex; align-items:center; gap:6px; font-family:var(--font-ui);
}
.btn:hover{ border-color:var(--glow); }
.btn.primary{ background:var(--glow); color:#04211B; border-color:var(--glow); }
.btn.primary:hover{ opacity:.9; }
.btn.ghost{ border-color:transparent; color:var(--ink-dim); }
.btn.ghost:hover{ color:var(--ink); }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn svg{ width:14px; height:14px; }

/* ================= side menu drawer ================= */
.drawer-scrim{ position:fixed; inset:0; background:rgba(2,3,4,0.55); z-index:30; display:none; }
.drawer-scrim.open{ display:block; animation:fadein .2s ease both; }
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(360px,88vw); background:var(--panel-strong);
  border-left:1px solid var(--line); z-index:31; transform:translateX(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{ transform:translateX(0); }
@media (prefers-reduced-motion: reduce){ .drawer{ transition:none; } }
.drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 12px; border-bottom:1px solid var(--line); }
.drawer-head span{ font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); }
.drawer-close{ background:none; border:none; color:var(--ink-dim); cursor:pointer; padding:4px; }
.drawer-close svg{ width:17px; height:17px; }
.drawer-nav{ display:flex; padding:10px 12px; gap:4px; border-bottom:1px solid var(--line); }
.drawer-nav button{
  flex:1; background:none; border:none; color:var(--ink-dim); font-size:12.5px; padding:9px 6px; border-radius:5px;
  cursor:pointer; font-family:var(--font-ui);
}
.drawer-nav button.active{ background:rgba(126,240,214,0.1); color:var(--glow); }
.drawer-body{ flex:1; overflow-y:auto; padding:14px 18px 24px; }
.drawer-body::-webkit-scrollbar{ width:6px; }
.drawer-body::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:3px; }

.d-panel{ display:none; }
.d-panel.active{ display:block; }

.enroll-row{
  display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line);
}
.enroll-row .l{ font-size:13.5px; }
.enroll-row .l small{ display:block; color:var(--ink-dim); font-size:11px; margin-top:2px; }
.enroll-visual{ height:64px; border:1px solid var(--line); border-radius:5px; background:rgba(255,255,255,0.02); margin:14px 0 10px; overflow:hidden; }
.enroll-visual canvas{ width:100%; height:100%; }
.enroll-timer{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); }
.enroll-status{ font-size:11.5px; color:var(--ink-dim); margin-top:8px; min-height:15px; }
.enroll-status.ok{ color:var(--glow); }

.person-row{ display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.avatar{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:600; background:rgba(255,178,56,0.12); color:var(--id); flex:none; }
.p-name{ font-size:13.5px; font-weight:500; }
.p-name small{ display:block; font-weight:400; color:var(--ink-dim); font-size:11px; margin-top:1px; }

.detail-block{ padding:12px 0 4px; border-top:1px solid var(--line); margin-top:6px; }
.detail-block .k{ font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:5px; }
.detail-block p{ font-size:12.5px; line-height:1.55; color:var(--ink); margin:0 0 14px; }
.back-link{ background:none; border:none; color:var(--ink-dim); font-size:12px; cursor:pointer; padding:0 0 10px; display:flex; align-items:center; gap:4px; }
.back-link svg{ width:13px; height:13px; }

.hist-row{ padding:12px 0; border-bottom:1px solid var(--line); }
.hist-row .hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.hist-row .who{ font-size:13px; font-weight:500; }
.hist-row .date{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); }
.hist-row .snip{ font-size:12px; color:var(--ink-dim); line-height:1.5; margin-bottom:6px; }
.hist-row .diar-bar{ margin-bottom:0; }

.empty-mini{ padding:40px 6px; text-align:center; color:var(--ink-dim); font-size:12.5px; }
.empty-mini svg{ width:24px; height:24px; opacity:.4; margin-bottom:10px; }

/* ================= naming modal ================= */
.overlay{
  position:fixed; inset:0; background:rgba(2,3,4,0.6); backdrop-filter:blur(3px); display:none;
  align-items:center; justify-content:center; z-index:100; padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px)); padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
}
.overlay.open{ display:flex; animation:fadein .2s ease both; }
.modal{
  width:100%; max-width:380px; background:var(--panel-strong); border:1px solid var(--line-strong); border-radius:6px;
  padding:22px 22px 20px; animation:cardup .3s cubic-bezier(.2,.8,.2,1) both;
}
.modal .m-kicker{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--id); margin-bottom:8px; }
.modal h2{ font-size:19px; font-weight:600; margin:0 0 16px; }
.field{ margin-bottom:13px; }
.field label{ display:block; font-size:11px; color:var(--ink-dim); margin-bottom:5px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em; }
.field input[type="text"], .field select{
  width:100%; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--ink); border-radius:4px;
  padding:9px 10px; font-size:14px; font-family:var(--font-ui);
}
.field input:focus, .field select:focus{ outline:2px solid var(--glow); outline-offset:1px; }
.field .err{ color:var(--rec); font-size:11.5px; margin-top:5px; display:none; }
.field.invalid input{ border-color:var(--rec); }
.field.invalid .err{ display:block; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

.toast-stack{ position:fixed; bottom:calc(100px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; padding:0 16px; pointer-events:none; }
.toast{
  background:var(--panel-strong); border:1px solid var(--line-strong); color:var(--ink); font-family:var(--font-mono);
  font-size:12px; padding:9px 16px; border-radius:999px; animation:toastin .3s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes toastin{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
</style>
</head>
<body>

<div class="viewfinder" id="viewfinder">
  <div class="idle-plate" id="idlePlate">
    <div class="idle-ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></div>
  </div>
  <video id="camFeed" autoplay playsinline muted class="hidden"></video>
  <canvas class="wave" id="waveCanvas"></canvas>

  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>
  <div class="scan-sweep" id="scanSweep"></div>

  <div class="brackets" aria-hidden="true"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

  <div class="hud-top">
    <div class="readout" id="readout" role="status" aria-live="polite">
      <span class="dot" id="readoutDot"></span>
      <span class="val" id="readoutText">Standby</span>
    </div>
    <div class="hud-controls">
      <button class="icon-btn" id="enrollQuickBtn" type="button" aria-label="Voice ID setup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="captions" id="captions" aria-live="polite"></div>

  <div class="dock">
    <div class="mode-pill" role="tablist" aria-label="Session mode">
      <button type="button" id="modeVisionBtn" class="active" role="tab" aria-selected="true" aria-label="Vision and voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button type="button" id="modeAudioBtn" role="tab" aria-selected="false" aria-label="Voice only">

<script>
(function(){
"use strict";

var STORE_KEY = "personalens_ar_state_v1";
var seedPeople = [
  { id:"p1", name:"Meera Krishnan", relation:"Daughter",
    firstSummary:"Meera visited on a Tuesday afternoon and reminded me about her promotion at the hospital — we talked about her new office and she brought jasmine flowers.",
    lastSummary:"Meera stopped by after work, asked how my knee was doing, and mentioned she's bringing the grandchildren this weekend.",
    lastSeen:"Sep 21, 2026", sessions:6 },
  { id:"p2", name:"Arjun Krishnan", relation:"Son",
    firstSummary:"Arjun called from Bengaluru to check in after the move, described his new apartment, and promised to visit next month.",
    lastSummary:"Arjun mentioned work has been busy but he booked train tickets for Diwali and asked about the medication schedule.",
    lastSeen:"Sep 14, 2026", sessions:4 },
  { id:"p3", name:"Priya Nair", relation:"Neighbor",
    firstSummary:"Priya introduced herself after moving in next door, brought over some homemade payasam, and offered to help with groceries.",
    lastSummary:"Priya dropped by to return a dish and chatted about the new flower beds along the compound wall.",
    lastSeen:"Sep 9, 2026", sessions:3 }
];
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var p = JSON.parse(raw); if(p && Array.isArray(p.people)) return p; }
  }catch(e){}
  return { enrolled:false, people: seedPeople, sessions: [] };
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
var state = loadState();

var $ = function(id){ return document.getElementById(id); };
function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }
function truncate(s,n){ s=s||"—"; return s.length>n ? s.slice(0,n-1)+"…" : s; }
function initials(name){ return name.split(" ").filter(Boolean).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase(); }
function fmtTime(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
function toast(msg){
  var el = document.createElement("div"); el.className="toast"; el.textContent=msg;
  toastStack.appendChild(el);
  setTimeout(function(){ el.style.transition="opacity .3s ease"; el.style.opacity="0"; setTimeout(function(){el.remove();},300); }, 2400);
}
var toastStack = $("toastStack");

/* ---------------- viewfinder + HUD refs ---------------- */
var viewfinder=$("viewfinder"), idlePlate=$("idlePlate"), camFeed=$("camFeed"), waveCanvas=$("waveCanvas");
var scanSweep=$("scanSweep"), readoutDot=$("readoutDot"), readoutText=$("readoutText");
var captions=$("captions"), recBtn=$("recBtn"), modeVisionBtn=$("modeVisionBtn"), modeAudioBtn=$("modeAudioBtn");
var sessionCardWrap=$("sessionCardWrap"), sessionCard=$("sessionCard");
var menuBtn=$("menuBtn"), enrollQuickBtn=$("enrollQuickBtn"), drawer=$("drawer"), drawerScrim=$("drawerScrim"), drawerCloseBtn=$("drawerCloseBtn");

var mode="vision", mediaStream=null, audioCtx=null, analyser=null, sourceNode=null, waveRAF=null;
var recording=false, sessionStart=null, timerInterval=null;
var recognizedPerson=null, recognitionTimer=null, transcriptTimer=null, transcriptCursor=0;
var transcriptLines=[], currentTranscriptPool=null, pendingUnknownVision=false;

function setMode(next){
  if(recording) return;
  mode = next;
  modeVisionBtn.classList.toggle("active", mode==="vision");
  modeVisionBtn.setAttribute("aria-selected", mode==="vision");
  modeAudioBtn.classList.toggle("active", mode==="audio");
  modeAudioBtn.setAttribute("aria-selected", mode==="audio");
  setReadout("dim", mode==="vision" ? "Standby" : "Standby · voice only");
}
modeVisionBtn.addEventListener("click", function(){ setMode("vision"); });
modeAudioBtn.addEventListener("click", function(){ setMode("audio"); });

function setReadout(kind, text){
  readoutText.textContent = text;
  readoutDot.className = "dot" + (kind==="live" ? " live" : kind==="ok" ? " ok" : kind==="match" ? " match" : "");
}

function drawWave(canvas, analyserNode, color){
  var ctx = canvas.getContext("2d");
  var dpr = window.devicePixelRatio||1;
  function resize(){ var r=canvas.getBoundingClientRect(); canvas.width=r.width*dpr; canvas.height=r.height*dpr; }
  resize();
  var bufferLength = analyserNode.frequencyBinCount;
  var data = new Uint8Array(bufferLength);
  var rafId;
  function loop(){
    rafId = requestAnimationFrame(loop);
    analyserNode.getByteFrequencyData(data);
    var w=canvas.width, h=canvas.height;
    ctx.clearRect(0,0,w,h);
    var bars=56, step=Math.floor(bufferLength/bars);
    var barW=w/bars*0.55, gap=w/bars*0.45;
    ctx.fillStyle = color;
    for(var i=0;i<bars;i++){
      var v = data[i*step]/255;
      var barH = Math.max(h*0.03, v*h*0.82);
      var x=i*(barW+gap)+gap/2, y=(h-barH)/2;
      ctx.globalAlpha = 0.32+v*0.68;
      roundRect(ctx,x,y,barW,barH,Math.min(4*dpr, barW/2));
    }
    ctx.globalAlpha=1;
  }
  loop();
  return function stop(){ cancelAnimationFrame(rafId); };
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();
}

/* ---------------- session lifecycle ---------------- */
function startSession(){
  transcriptLines=[]; transcriptCursor=0; recognizedPerson=null; pendingUnknownVision=false;
  captions.innerHTML="";
  sessionCardWrap.classList.remove("open");

  var constraints = mode==="vision" ? {video:{facingMode:"user"}, audio:true} : {audio:true};
  navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
    mediaStream = stream;
    recording = true;
    recBtn.classList.add("recording");
    recBtn.setAttribute("aria-label","Stop recording");
    idlePlate.style.display="none";

    if(mode==="vision"){
      camFeed.srcObject = stream;
      camFeed.classList.remove("hidden");
      waveCanvas.classList.remove("on");
      scanSweep.classList.add("active");
    } else {
      waveCanvas.classList.add("on");
      camFeed.classList.add("hidden");
    }

    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    sourceNode.connect(analyser);
    if(mode==="audio") waveRAF = drawWave(waveCanvas, analyser, getComputedStyle(document.documentElement).getPropertyValue("--glow").trim());

    sessionStart = Date.now();
    setReadout("live", "Rec 00:00");
    timerInterval = setInterval(function(){
      var sec = Math.floor((Date.now()-sessionStart)/1000);
      var label = mode==="vision" && recognizedPerson ? recognizedPerson.name.split(" ")[0] : (mode==="vision" ? "Scanning" : "Listening");
      setReadout("live", "Rec " + fmtTime(sec) + " · " + label);
    }, 1000);

    if(mode==="vision") recognitionTimer = setTimeout(runFaceRecognition, 2200);
    beginTranscriptStream();
  }).catch(function(){
    toast(mode==="vision" ? "Camera or mic blocked" : "Mic blocked");
  });
}

function runFaceRecognition(){
  if(!recording) return;
  scanSweep.classList.remove("active");
  var roll = Math.random();
  var result = roll < 0.62 ? state.people[Math.floor(Math.random()*state.people.length)] : null;
  var confidence = result ? (90 + Math.floor(Math.random()*9)) : (24 + Math.floor(Math.random()*30));

  var tag = document.createElement("div");
  tag.className = "face-tag" + (result ? "" : " unknown");
  var w = 27 + Math.random()*5, h = 36 + Math.random()*5;
  tag.style.width = w+"%"; tag.style.height = h+"%";
  tag.style.left = (36 + Math.random()*6)+"%"; tag.style.top = (18 + Math.random()*5)+"%";
  tag.innerHTML = '<div class="box"></div><div class="lead"></div><div class="label"></div>';
  var label = tag.querySelector(".label");
  if(result){
    recognizedPerson = result;
    label.innerHTML = esc(result.name) + '<span class="sub">' + confidence + '% match</span>';
    setReadout("match", result.name.split(" ")[0] + " matched");
  } else {
    pendingUnknownVision = true;
    label.innerHTML = 'Unmatched<span class="sub">' + confidence + '% confidence</span>';
    setReadout("ok", "No match found");
  }
  viewfinder.appendChild(tag);
}

var TRANSCRIPT_POOLS = {
  known: [
    {speaker:"other", text:"Hi Amma, it's me — I brought some of the payasam you like."},
    {speaker:"host", text:"Oh wonderful, come in, come in. How was the drive?"},
    {speaker:"other", text:"Not bad. How's your knee been feeling?"},
    {speaker:"host", text:"Much better, the exercises are helping."},
    {speaker:"other", text:"Good. We're planning to visit this weekend with the kids."},
    {speaker:"host", text:"That would make me so happy."},
    {speaker:"other", text:"Don't forget your evening tablets, okay?"},
    {speaker:"host", text:"I won't, I promise. Sit, have tea with me."}
  ],
  unknown: [
    {speaker:"other", text:"Good afternoon — I don't think we've met. I'm from next door."},
    {speaker:"host", text:"Oh hello, nice to meet you. Please, sit."},
    {speaker:"other", text:"I wanted to see if you needed anything from the market."},
    {speaker:"host", text:"That's kind — maybe some milk, if it's no trouble."},
    {speaker:"other", text:"Not at all, I'll drop it by this evening."},
    {speaker:"host", text:"Thank you. What did you say your name was?"},
    {speaker:"other", text:"I'll write it down before I go, don't worry."}
  ],
  audio: [
    {speaker:"other", text:"Hi, calling about the community health check-up next week."},
    {speaker:"host", text:"Oh yes, I remember a note about that."},
    {speaker:"other", text:"We just need to confirm Thursday morning."},
    {speaker:"host", text:"Thursday morning works fine."},
    {speaker:"other", text:"Perfect. Anything else you'd like us to know?"},
    {speaker:"host", text:"No, that covers it. Thank you."}
  ]
};
function beginTranscriptStream(){
  currentTranscriptPool = (mode==="audio" ? TRANSCRIPT_POOLS.audio : (Math.random()<0.55 ? TRANSCRIPT_POOLS.known : TRANSCRIPT_POOLS.unknown)).slice();
  transcriptCursor = 0;
  pushNextLine();
}
function pushNextLine(){
  if(!recording || transcriptCursor >= currentTranscriptPool.length){
    if(recording) transcriptTimer = setTimeout(pushNextLine, 3800);
    return;
  }
  var line = currentTranscriptPool[transcriptCursor++];
  transcriptLines.push(line);
  var el = document.createElement("div");
  el.className = "cap-line " + line.speaker;
  el.innerHTML = '<span class="tag" aria-hidden="true"></span><span></span>';
  el.querySelector("span:last-child").textContent = line.text;
  captions.appendChild(el);
  while(captions.children.length > 3) captions.removeChild(captions.firstChild);
  transcriptTimer = setTimeout(pushNextLine, 2600 + Math.random()*1400);
}

function stopSession(){
  recording = false;
  recBtn.classList.remove("recording");
  recBtn.setAttribute("aria-label","Start recording");
  clearTimeout(recognitionTimer); clearTimeout(transcriptTimer); clearInterval(timerInterval);
  if(waveRAF) waveRAF();
  scanSweep.classList.remove("active");

  if(mediaStream){ mediaStream.getTracks().forEach(function(t){t.stop();}); mediaStream=null; }
  if(audioCtx){ audioCtx.close(); audioCtx=null; }
  camFeed.srcObject=null; camFeed.classList.add("hidden");
  waveCanvas.classList.remove("on");
  Array.prototype.slice.call(viewfinder.querySelectorAll(".face-tag")).forEach(function(t){t.remove();});
  captions.innerHTML="";
  idlePlate.style.display="flex";
  setReadout("dim", mode==="vision" ? "Standby" : "Standby · voice only");

  var durationSec = sessionStart ? Math.max(4, Math.floor((Date.now()-sessionStart)/1000)) : 12;
  finalizeSession(durationSec);
}
recBtn.addEventListener("click", function(){ if(!recording) startSession(); else stopSession(); });

/* ---------------- finalize / summary / naming ---------------- */
function computeDiarization(){
  var h=0,o=0;
  transcriptLines.forEach(function(l){ if(l.speaker==="host") h+=l.text.length; else o+=l.text.length; });
  var t=h+o||1, hp=Math.round(h/t*100);
  return {hostPct:hp, otherPct:100-hp};
}
var SUMMARY_TOPICS = [
  "medication and how the knee has been feeling",
  "an upcoming weekend visit with the grandchildren",
  "the community health check-up appointment",
  "the flowers and payasam brought over as a gift",
  "plans for the Diwali travel",
  "a quiet cup of tea and catching up on the week"
];
function generateSummary(person){
  var topic = SUMMARY_TOPICS[Math.floor(Math.random()*SUMMARY_TOPICS.length)];
  var who = person ? person.name : (mode==="audio" ? "The caller" : "The visitor");
  return who + " talked about " + topic + ".";
}
var lastSessionMeta = null;

function finalizeSession(durationSec){
  var diar = computeDiarization();
  var summaryText = generateSummary(recognizedPerson);
  var isUnnamed = !recognizedPerson;

  lastSessionMeta = {
    id:"s"+Date.now(), date:new Date(), durationSec:durationSec, mode:mode,
    personId: recognizedPerson ? recognizedPerson.id : null,
    personName: recognizedPerson ? recognizedPerson.name : null,
    summary: summaryText, diar: diar
  };

  if(recognizedPerson){
    recognizedPerson.lastSummary = summaryText;
    if(!recognizedPerson.firstSummary) recognizedPerson.firstSummary = summaryText;
    recognizedPerson.lastSeen = lastSessionMeta.date.toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"});
    recognizedPerson.sessions = (recognizedPerson.sessions||0)+1;
  }
  state.sessions.unshift(lastSessionMeta);
  saveState();
  renderSessionCard(lastSessionMeta, isUnnamed);
  if(isUnnamed) setTimeout(openNameModal, 500);
}

function renderSessionCard(meta, isUnnamed){
  var diar = meta.diar;
  sessionCard.innerHTML = ''
    + '<div class="sc-top"><span class="sc-kicker">' + (meta.mode==="vision"?"Vision":"Voice only") + ' · ' + fmtTime(meta.durationSec) + '</span>'
    + '<button class="sc-close" id="scCloseBtn" aria-label="Dismiss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>'
    + '<h2>' + (meta.personName ? esc(meta.personName) : "Unmatched speaker") + '</h2>'
    + '<p>' + esc(meta.summary) + '</p>'
    + '<div class="diar-bar"><span class="host" style="width:'+diar.hostPct+'%"></span><span class="other" style="width:'+diar.otherPct+'%"></span></div>'
    + '<div class="sc-actions">'
    + (isUnnamed ? '<button class="btn primary" id="nameNowBtn" type="button">Name person</button>' : '')
    + '<button class="btn ghost" id="scCloseBtn2" type="button">Dismiss</button>'
    + '</div>';
  sessionCardWrap.classList.add("open");
  var nameNowBtn = $("nameNowBtn");
  if(nameNowBtn) nameNowBtn.addEventListener("click", openNameModal);
  $("scCloseBtn").addEventListener("click", function(){ sessionCardWrap.classList.remove("open"); });
  $("scCloseBtn2").addEventListener("click", function(){ sessionCardWrap.classList.remove("open"); });
}

/* ---------------- naming modal ---------------- */
var nameOverlay=$("nameOverlay"), nameInput=$("nameInput"), relInput=$("relInput"), nameField=$("nameField");
var nameSaveBtn=$("nameSaveBtn"), nameLaterBtn=$("nameLaterBtn");
function openNameModal(){
  nameInput.value=""; relInput.value=""; nameField.classList.remove("invalid");
  nameOverlay.classList.add("open");
  setTimeout(function(){ nameInput.focus(); }, 60);
}
function closeNameModal(){ nameOverlay.classList.remove("open"); }
nameLaterBtn.addEventListener("click", closeNameModal);
nameOverlay.addEventListener("click", function(e){ if(e.target===nameOverlay) closeNameModal(); });
nameInput.addEventListener("input", function(){ nameField.classList.remove("invalid"); });
nameSaveBtn.addEventListener("click", function(){
  var val = nameInput.value.trim();
  if(!val){ nameField.classList.add("invalid"); nameInput.focus(); return; }
  var newPerson = {
    id:"p"+Date.now(), name:val, relation:relInput.value||"Not specified",
    firstSummary: lastSessionMeta ? lastSessionMeta.summary : "",
    lastSummary: lastSessionMeta ? lastSessionMeta.summary : "",
    lastSeen: new Date().toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"}),
    sessions:1
  };
  state.people.push(newPerson);
  if(lastSessionMeta){ lastSessionMeta.personId=newPerson.id; lastSessionMeta.personName=newPerson.name; }
  saveState();
  closeNameModal();
  toast("Saved " + newPerson.name);
  renderPeople(); renderHistory();
  renderSessionCard(lastSessionMeta, false);
});

/* ---------------- drawer / menu ---------------- */
var drawerNavBtns = document.querySelectorAll(".drawer-nav button");
function openDrawer(panel){
  drawer.classList.add("open"); drawerScrim.classList.add("open");
  if(panel) switchPanel(panel);
  renderPeople(); renderHistory();
}
function closeDrawer(){ drawer.classList.remove("open"); drawerScrim.classList.remove("open"); }
menuBtn.addEventListener("click", function(){ openDrawer("people"); });
drawerCloseBtn.addEventListener("click", closeDrawer);
drawerScrim.addEventListener("click", closeDrawer);
enrollQuickBtn.addEventListener("click", function(){ openEnrollModal(); });

function switchPanel(name){
  drawerNavBtns.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-panel")===name); });
  ["people","history","voice"].forEach(function(p){ $("panel-"+p).classList.toggle("active", p===name); });
}
drawerNavBtns.forEach(function(b){ b.addEventListener("click", function(){ switchPanel(b.getAttribute("data-panel")); }); });

/* people */
var peopleList=$("peopleList"), peopleDetail=$("peopleDetail");
function renderPeople(){
  peopleDetail.style.display="none"; peopleList.style.display="block";
  if(state.people.length===0){
    peopleList.innerHTML = '<div class="empty-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>No one logged yet.</div>';
    return;
  }
  var sorted = state.people.slice().sort(function(a,b){ return (b.sessions||0)-(a.sessions||0); });
  peopleList.innerHTML = sorted.map(function(p){
    return '<div class="person-row" data-id="'+p.id+'" tabindex="0" role="button">'
      + '<div class="avatar">'+esc(initials(p.name))+'</div>'
      + '<div class="p-name">'+esc(p.name)+'<small>'+esc(p.relation)+' · '+(p.sessions||0)+' session'+(p.sessions===1?"":"s")+'</small></div></div>';
  }).join("");
  Array.prototype.slice.call(peopleList.querySelectorAll(".person-row")).forEach(function(row){
    row.addEventListener("click", function(){ openPersonDetail(row.getAttribute("data-id")); });
    row.addEventListener("keypress", function(e){ if(e.key==="Enter") openPersonDetail(row.getAttribute("data-id")); });
  });
}
function openPersonDetail(id){
  var p = state.people.find(function(x){ return x.id===id; });
  if(!p) return;
  peopleList.style.display="none"; peopleDetail.style.display="block";
  peopleDetail.innerHTML = ''
    + '<button class="back-link" id="backToList"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>People</button>'
    + '<div class="p-name" style="font-size:15px;">'+esc(p.name)+'<small>'+esc(p.relation)+' · last seen '+esc(p.lastSeen||"—")+'</small></div>'
    + '<div class="detail-block"><div class="k">First met</div><p>'+esc(p.firstSummary||"No summary yet.")+'</p></div>'
    + '<div class="detail-block" style="border-top:none; padding-top:0;"><div class="k">Most recent</div><p>'+esc(p.lastSummary||"No summary yet.")+'</p></div>';
  $("backToList").addEventListener("click", renderPeople);
}

/* history */
var historyList=$("historyList");
function renderHistory(){
  if(state.sessions.length===0){
    historyList.innerHTML = '<div class="empty-mini"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>No sessions yet.</div>';
    return;
  }
  historyList.innerHTML = state.sessions.map(function(s){
    var d = new Date(s.date);
    return '<div class="hist-row">'
      + '<div class="hd"><span class="who">'+(s.personName?esc(s.personName):"Unnamed")+'</span><span class="date">'+d.toLocaleDateString([], {month:"short", day:"numeric"})+'</span></div>'
      + '<div class="snip">'+esc(truncate(s.summary,110))+'</div>'
      + '<div class="diar-bar"><span class="host" style="width:'+s.diar.hostPct+'%"></span><span class="other" style="width:'+s.diar.otherPct+'%"></span></div>'
      + '</div>';
  }).join("");
}

/* ---------------- voice enrollment (drawer + first-run modal share logic) ---------------- */
function makeEnrollController(canvasEl, recBtnEl, timerEl, statusEl, saveBtnEl){
  var stream=null, ctx=null, analyserNode=null, source=null, raf=null, recorder=null, chunks=[];
  var timerInt=null, seconds=0, recordingNow=false, hasSample=state.enrolled;
  function draw(){
    var c = canvasEl.getContext("2d");
    var bufferLength = analyserNode.frequencyBinCount;
    var data = new Uint8Array(bufferLength);
    function loop(){
      raf = requestAnimationFrame(loop);
      analyserNode.getByteFrequencyData(data);
      var w=canvasEl.width,h=canvasEl.height;
      c.clearRect(0,0,w,h);
      var bars=36, step=Math.floor(bufferLength/bars), barW=w/bars*0.6, gap=w/bars*0.4;
      c.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--id").trim() || "#FFB238";
      for(var i=0;i<bars;i++){
        var v=data[i*step]/255, barH=Math.max(h*0.05,v*h*0.8), x=i*(barW+gap)+gap/2, y=(h-barH)/2;
        c.globalAlpha=0.4+v*0.6; roundRect(c,x,y,barW,barH,Math.min(3,barW/2));
      }
      c.globalAlpha=1;
    }
    loop();
  }
  function resize(){ var r=canvasEl.getBoundingClientRect(); var dpr=window.devicePixelRatio||1; canvasEl.width=r.width*dpr; canvasEl.height=r.height*dpr; }
  function start(){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream=s; recordingNow=true; resize();
      recBtnEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="7" width="10" height="10" rx="2"/></svg> Stop';
      statusEl.textContent = "Recording…"; statusEl.className="enroll-status";
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      source = ctx.createMediaStreamSource(stream);
      analyserNode = ctx.createAnalyser(); analyserNode.fftSize=256;
      source.connect(analyserNode);
      draw();
      try{ chunks=[]; recorder=new MediaRecorder(stream); recorder.ondataavailable=function(e){ if(e.data.size>0) chunks.push(e.data); }; recorder.start(); }catch(e){}
      seconds=0; timerEl.textContent="0.0s";
      timerInt = setInterval(function(){ seconds+=0.1; timerEl.textContent=seconds.toFixed(1)+"s"; }, 100);
    }).catch(function(){ toast("Mic blocked"); });
  }
  function stop(){
    if(!recordingNow) return;
    recordingNow=false; clearInterval(timerInt); cancelAnimationFrame(raf);
    recBtnEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6"/></svg> Record';
    if(recorder && recorder.state!=="inactive"){ try{ recorder.stop(); }catch(e){} }
    if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; }
    if(ctx){ ctx.close(); ctx=null; }
    if(seconds<2){ statusEl.textContent="Too short — try again."; hasSample=false; saveBtnEl.disabled=true; }
    else{ statusEl.textContent="Captured "+seconds.toFixed(1)+"s"; statusEl.className="enroll-status ok"; hasSample=true; saveBtnEl.disabled=false; }
  }
  recBtnEl.addEventListener("click", function(){ recordingNow ? stop() : start(); });
  return { stopIfActive: function(){ if(recordingNow) stop(); }, save: function(){
      state.enrolled=true; saveState(); refreshEnrollUI(); toast("Voice profile saved");
    } };
}
var enrollA = makeEnrollController($("enrollCanvas"), $("enrollRecBtn"), $("enrollTimer"), $("enrollStatus"), $("enrollSaveBtn"));
$("enrollSaveBtn").addEventListener("click", function(){ if(!$("enrollSaveBtn").disabled) enrollA.save(); });

var enrollOverlay=$("enrollOverlay");
var enrollB = makeEnrollController($("enrollCanvas2"), $("enrollRecBtn2"), $("enrollTimer2"), $("enrollStatus2"), $("enrollSaveBtn2"));
$("enrollSaveBtn2").addEventListener("click", function(){ if(!$("enrollSaveBtn2").disabled){ enrollB.save(); closeEnrollModal(); } });
$("enrollSkipBtn2").addEventListener("click", closeEnrollModal);
enrollOverlay.addEventListener("click", function(e){ if(e.target===enrollOverlay) closeEnrollModal(); });

function openEnrollModal(){ enrollOverlay.classList.add("open"); }
function closeEnrollModal(){ enrollOverlay.classList.remove("open"); enrollB.stopIfActive(); }

function refreshEnrollUI(){
  $("voiceStatusText").textContent = state.enrolled ? "Enrolled" : "Not enrolled";
  enrollQuickBtn.classList.toggle("id-on", state.enrolled);
}

/* ---------------- boot ---------------- */
function boot(){
  refreshEnrollUI();
  setMode("vision");
  renderPeople(); renderHistory();
  if(!state.enrolled) setTimeout(openEnrollModal, 500);
  window.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      if(nameOverlay.classList.contains("open")) closeNameModal();
      else if(enrollOverlay.classList.contains("open") && state.enrolled) closeEnrollModal();
      else if(drawer.classList.contains("open")) closeDrawer();
    }
  });
}
boot();

})();
</script>
